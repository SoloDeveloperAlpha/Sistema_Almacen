spring.application.name=stock_flow
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:stock_flow}?createDatabaseIfNotExist=true&serverTimezone=UTC&sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200}
app.bootstrap-admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.session-duration-hours=${SESSION_DURATION_HOURS:8}
