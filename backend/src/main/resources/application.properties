spring.application.name=stock_flow
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_flow?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200}
app.bootstrap-admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.session-duration-hours=${SESSION_DURATION_HOURS:8}
