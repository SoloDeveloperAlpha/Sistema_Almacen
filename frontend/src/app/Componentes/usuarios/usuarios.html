<div class="container bg-white p-4 rounded-4 shadow-sm border border-light">
  <div class="mb-4">
    <span class="text-uppercase text-primary font-monospace small">Administración</span>
    <h2 class="fw-bold">Usuarios y permisos</h2>
    <p class="text-muted">Activa cuentas y define quién puede administrar el almacén.</p>
  </div>
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  <div class="table-responsive">
    <table class="table align-middle">
      <thead class="table-light">
        <tr>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Rol</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (usuario of usuarios; track usuario.id) {
          <tr>
            <td class="font-monospace">{{ usuario.usuario }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>
              <select class="form-select" [(ngModel)]="usuario.rol">
                <option value="OPERATIVO">Operativo</option>
                <option value="ADMINISTRADOR">Administrador</option>
              </select>
            </td>
            <td>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" [(ngModel)]="usuario.activo" />
              </div>
            </td>
            <td>
              <button class="btn btn-sm btn-primary" (click)="actualizar(usuario)">Guardar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
