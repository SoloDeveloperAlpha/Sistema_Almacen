<div class="container bg-white p-4 rounded-4 shadow-sm border border-light" style="max-width: 900px">
  <div class="mb-4"><span class="text-uppercase text-success font-monospace small">Movimiento de inventario</span><h2 class="fw-bold">Registrar entrada</h2><p class="text-muted">La cantidad se sumará al stock y quedará en el historial.</p></div>
  @if (error) { <div class="alert alert-danger">{{ error }}</div> }
  <form class="row g-3" (ngSubmit)="guardar()">
    <div class="col-md-6"><label class="form-label">Código / SKU *</label><input class="form-control font-monospace" [(ngModel)]="datos.codigo" name="codigo" readonly required /><small class="text-muted">Código consecutivo generado automáticamente.</small></div>
    <div class="col-md-6"><label class="form-label">Nombre del producto *</label><input class="form-control" [(ngModel)]="datos.nombre" name="nombre" required /></div>
    <div class="col-md-4"><label class="form-label">Categoría *</label><input class="form-control" [(ngModel)]="datos.categoria" name="categoria" required /></div>
    <div class="col-md-4"><label class="form-label">Unidad de medida *</label><input class="form-control" [(ngModel)]="datos.unidadMedida" name="unidadMedida" required /></div>
    <div class="col-md-4"><label class="form-label">Cantidad *</label><input class="form-control" type="number" min="1" [(ngModel)]="datos.cantidad" name="cantidad" required /></div>
    <div class="col-md-4"><label class="form-label">Stock mínimo</label><input class="form-control" type="number" min="0" [(ngModel)]="datos.stockMinimo" name="stockMinimo" /></div>
    <div class="col-md-4"><label class="form-label">Ubicación</label><input class="form-control" [(ngModel)]="datos.ubicacion" name="ubicacion" placeholder="Estante A-04" /></div>
    <div class="col-md-4"><label class="form-label">Proveedor</label><input class="form-control" [(ngModel)]="datos.proveedor" name="proveedor" /></div>
    <div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" [(ngModel)]="datos.observaciones" name="observaciones" rows="3"></textarea></div>
    <div class="col-12 d-flex justify-content-end gap-2"><a routerLink="/inventario" class="btn btn-light">Cancelar</a><button class="btn btn-success" type="submit" [disabled]="guardando || cargandoCodigo || !datos.codigo">{{ guardando ? 'Guardando...' : 'Guardar entrada' }}</button></div>
  </form>
</div>
